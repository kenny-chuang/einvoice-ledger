name: 發票記帳助手
version: 1.0.0
slug: einvoice_ledger
description: 私有部署的電子發票記帳、商品歷史比價、預算與資料品質管理工具
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8000
ingress_entry: /
panel_icon: mdi:receipt-text-outline
panel_title: 發票記帳
panel_admin: true
init: false
apparmor: true
startup: application
stage: experimental
services:
  - mqtt:want
watchdog: http://[HOST]:[PORT:8000]/api/status
backup: hot
backup_exclude:
  - browser-state.json
  - crawler-debug.json
  - crawler-error.png
  - login-debug.json
  - login-preview-error.png
  - login-submit-error.png
options:
  timezone: Asia/Taipei
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  timezone: str
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
