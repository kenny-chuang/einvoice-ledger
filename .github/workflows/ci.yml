name: 發票記帳助手 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: einvoice_ledger/requirements.txt
      - run: pip install -r einvoice_ledger/requirements.txt
      - run: pytest -q
        working-directory: einvoice_ledger
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: einvoice_ledger/frontend/package-lock.json
      - run: npm ci
        working-directory: einvoice_ledger/frontend
      - run: npm run build
        working-directory: einvoice_ledger/frontend
      - run: npm test
        working-directory: einvoice_ledger/frontend
      - name: Migration and anonymous database smoke test
        run: |
          mkdir -p /tmp/einvoice-ci
          E_INVOICE_DATA_DIR=/tmp/einvoice-ci python -c "from app.database import init_database; init_database()"
          E_INVOICE_DATA_DIR=/tmp/einvoice-ci alembic current
        working-directory: einvoice_ledger
      - name: Docker build
        run: docker build --build-arg BUILD_VERSION=1.0.0 -t einvoice-ledger:1.0.0 .
        working-directory: einvoice_ledger
      - name: Local Playwright E2E
        run: |
          npx playwright install --with-deps chromium
          docker run -d --name einvoice-ci -p 127.0.0.1:8000:8000 -v /tmp/einvoice-ci:/data einvoice-ledger:1.0.0
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/status && break; sleep 1; done
          npm run test:e2e
          docker rm -f einvoice-ci
        working-directory: einvoice_ledger/frontend

  multiarch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify ARM64 and AMD64 images
        uses: docker/build-push-action@v6
        with:
          context: einvoice_ledger
          platforms: linux/amd64,linux/arm64
          push: false
          tags: einvoice-ledger:1.0.0
